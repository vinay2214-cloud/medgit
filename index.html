<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedGit — Medicine List Reconciliation</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="description" content="Git merge for medication lists. Synthetic data only, not for clinical use." />
    <script>
      // No-flash theme script: read storage before first paint
      try {
        const stored = localStorage.getItem('medgit.theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.dataset.theme = stored;
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
